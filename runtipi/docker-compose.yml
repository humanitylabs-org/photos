# photos: Immich (https://immich.app, AGPL-3.0), unmodified and pinned by digest, behind a small Wizard front.
# The main service is the front (mcp/front.py + mcp/tools.py, inlined by mcp/inline.py): it serves the Wizard page
# at /photos/ and the agent's tools at /mcp (box-only), and passes every other request unchanged to photos-server,
# so the app's own port is plain Immich for the web app and the Immich phone app.
# Library: Files > Photos > Library (Immich's /data). Takeout drop folder: Files > Photos > Import.
# Upstream reference: https://github.com/immich-app/immich/releases/download/v3.4.1/docker-compose.yml
services:
  photos:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    # Root inside the container with no capabilities but CHOWN (to make the drop folder writable for Files, uid
    # 1000), so the agent key stays in a 0700 folder on a named volume. Runtipi opens app-data to everyone.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    # immich-go (the Takeout importer) runs inside this container while an import is going.
    mem_limit: 2g
    tmpfs: ["/tmp:rw,nosuid,size=256m"]
    environment:
      WIZARD_APP: photos
      APP_VERSION: 0.4.0
      FRONT_PORT: "8080"
      UPSTREAM_HOST: photos-server
      UPSTREAM_PORT: "2283"
      APP_PORT: ${APP_PORT}
      STATE_DIR: /state
      IMPORT_DIR: /import
      LIBRARY_DIR: /library
      PYTHONDONTWRITEBYTECODE: "1"
      # The App Manager fills these at install: the Wizard page then answers only the box owner's shell origins.
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_OWNER_LOGINS: ${WIZARD_OWNER_LOGINS:-}
    volumes:
      - photos-state:/state
      - ${ROOT_FOLDER_HOST}/media/Photos/Import:/import
      - ${ROOT_FOLDER_HOST}/media/Photos/Library:/library:ro
    depends_on:
      - photos-server
    command:
      - python
      - -c
      # BEGIN MCP FRONT (generated by mcp/inline.py)
      - |
        """Wizard MCP front (compressed; source: mcp/front.py + mcp/tools.py, packed by mcp/inline.py)."""
        import base64, zlib
        exec(compile(zlib.decompress(base64.b64decode("")), "front.py", "exec"))
      # END MCP FRONT
    x-runtipi:
      is_main: true
      internal_port: 8080
  photos-server:
    # Unmodified official Immich server (AGPL-3.0), pinned by digest.
    image: ghcr.io/immich-app/immich-server:v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b
    security_opt: ["no-new-privileges:true"]
    pids_limit: 4096
    mem_limit: 6g
    environment:
      TZ: ${TZ:-UTC}
      DB_HOSTNAME: photos-db
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      # A random password made on first start, kept with the database (see photos-db), never in app.env.
      DB_PASSWORD_FILE: /secrets/db-password
      REDIS_HOSTNAME: photos-redis
      IMMICH_MACHINE_LEARNING_URL: http://photos-ml:3003
    volumes:
      # Originals, thumbnails and Immich's own database backups, under the owner's Files.
      - ${ROOT_FOLDER_HOST}/media/Photos/Library:/data
      - photos-secrets:/secrets:ro
    depends_on:
      - photos-db
      - photos-redis
    healthcheck:
      test: ["CMD-SHELL", "immich-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  photos-ml:
    # Unmodified official Immich machine learning (faces, smart search), CPU build, pinned by digest.
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.1@sha256:8adebf414256f6e4f837bfbb66fa94f14f4da7260e3a1d65cbba49e4e35d8764
    security_opt: ["no-new-privileges:true"]
    pids_limit: 4096
    mem_limit: 6g
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
    volumes:
      - photos-model-cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "python3 healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  photos-redis:
    # Valkey, as pinned by Immich's v3.4.1 compose.
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
  photos-db:
    # Immich's Postgres with VectorChord, as pinned by Immich's v3.4.1 compose. The first start makes a random
    # password into the secrets volume (root-only plus the postgres group) and initialises the database with it.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    mem_limit: 4g
    shm_size: 128mb
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_PASSWORD_FILE: /secrets/db-password
      POSTGRES_INITDB_ARGS: --data-checksums
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /secrets/db-password ]; then
          umask 077
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/db-password.tmp
          mv /secrets/db-password.tmp /secrets/db-password
        fi
        chown 0:999 /secrets/db-password && chmod 0640 /secrets/db-password
        exec /usr/local/bin/immich-docker-entrypoint.sh "$$@"
      - photos-db
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - photos-db:/var/lib/postgresql/data
      - photos-secrets:/secrets
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
volumes:
  # The database, its password, the agent key and the face/search models (kept across app updates).
  # The photos themselves live in Files > Photos > Library.
  photos-state: {}
  photos-secrets: {}
  photos-db: {}
  photos-model-cache: {}
x-runtipi:
  schema_version: 2
  overrides: []
